<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Recargas</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Recargas VE</h1>

    <form id="vehicleForm" class="card">
      <input id="matricula" type="text" placeholder="Matrícula" maxlength="20" required />
      <input id="mapsUrl" type="url" placeholder="Enlace de Google Maps" required />
      <textarea id="notas" placeholder="Notas"></textarea>
      <button id="vehicleSubmitButton" type="submit">Añadir vehículo</button>
      <button id="cancelEditButton" class="secondary" type="button" hidden>Cancelar edición</button>
    </form>

    <section class="map-section" aria-labelledby="mapTitle">
      <h2 id="mapTitle">
        <button
          id="mapToggle"
          class="section-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="mapContent"
        >
          <span>Mapa de vehículos</span>
          <span class="section-toggle-icon" aria-hidden="true">▾</span>
        </button>
      </h2>
      <div id="mapContent" class="card map-card" hidden>
        <div id="vehiclesMap" class="vehicles-map" aria-label="Mapa con la posición de los vehículos"></div>
      </div>
    </section>

    <section>
      <h2>
        <button
          id="vehiclesToggle"
          class="section-toggle vehicles-section-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="vehicleList"
        >
          <span class="vehicles-section-header">
            <span class="vehicles-section-title">Vehículos (<span id="vehiclesCount">0</span>)</span>
            <span class="section-toggle-icon" aria-hidden="true">▾</span>
          </span>
          <span class="vehicles-section-controls">
            <span
              id="sortByDistanceButton"
              class="sort-by-distance-button"
              role="button"
              aria-pressed="false"
              tabindex="0"
            >Ordenar: Off</span>
            <span
              id="deleteAllVehiclesButton"
              class="delete-all-vehicles-button"
              role="button"
              tabindex="0"
            >Borrar</span>
            <span
              id="saveVehicleListButton"
              class="save-vehicle-list-button"
              role="button"
              tabindex="0"
            >Guardar lista</span>
            <span
              id="shareVehicleListButton"
              class="share-vehicle-list-button"
              role="button"
              tabindex="0"
            >Compartir</span>
            <span
              id="importVehicleListButton"
              class="import-vehicle-list-button"
              role="button"
              tabindex="0"
            >Importar</span>
          </span>
        </button>
      </h2>
      <input id="importVehicleListInput" type="file" accept="application/json,.json" hidden />
      <div id="vehicleTransferPanel" class="vehicle-transfer-panel card" hidden>
        <div class="vehicle-transfer-header">
          <h3 id="vehicleTransferTitle">Transferir lista</h3>
          <button id="closeVehicleTransferPanelButton" class="secondary" type="button">Cerrar</button>
        </div>
        <p id="vehicleTransferHelp" class="vehicle-transfer-help">
          Copia aquí los datos para enviarlos por WhatsApp, o pega una lista recibida para importarla.
        </p>
        <textarea
          id="vehicleTransferText"
          class="vehicle-transfer-text"
          placeholder="Aquí aparecerá la lista exportada o puedes pegar una lista recibida..."
          spellcheck="false"
        ></textarea>
        <div class="vehicle-transfer-actions">
          <button id="copyVehicleTransferButton" type="button">Copiar texto</button>
          <button id="downloadVehicleTransferButton" type="button">Descargar JSON</button>
          <button id="importVehicleTransferTextButton" type="button">Importar texto</button>
          <button id="selectImportVehicleFileButton" class="secondary" type="button">Elegir archivo</button>
        </div>
      </div>
      <div id="vehicleList" class="vehicle-list" hidden></div>
    </section>

    <section>
      <h2>
        <button
          id="savedListsToggle"
          class="section-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="savedLists"
        >
          <span>Listas guardadas (<span id="savedListsCount">0</span>)</span>
          <span class="section-toggle-icon" aria-hidden="true">▾</span>
        </button>
      </h2>
      <div id="savedLists" class="saved-lists" hidden></div>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <script src="app.js"></script>
</body>
</html>
